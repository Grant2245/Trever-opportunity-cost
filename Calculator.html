<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trever.exe</title>
<style>
  body{
    margin:0; padding:0;
    background:#0b1020; color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
    display:flex; justify-content:center; align-items:center;
    height:100vh;
  }
  .card{
    background:#0f1724; padding:24px; border-radius:16px;
    text-align:center; max-width:600px;
    box-shadow:0 10px 30px rgba(2,6,23,0.6);
  }
  .money{
    font-size:48px; font-weight:700; margin:20px 0;
  }
  .bananas{
    font-size:20px; margin-top:15px;
  }
  a.help{
    display:block; margin-top:20px; color:#E6C07B; font-weight:600;
    text-decoration:none;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Trever opportunity cost calculator</h1>
  <div id="money" class="money">$0.00000</div>
  <div id="bananaCount" class="bananas">Bananas: 0</div>
  <a class="help" href="https://www.roomies.com/scappoose-or" target="_blank">Find roommates near you</a>
</div>
<script>
const START = new Date(Date.UTC(2025, 4, 27, 0, 0, 0)); // iPhone-safe date
const MONTHLY = 800;
const AVG_MONTH_SEC = 2629746;
const RATE_PER_MS = MONTHLY / (AVG_MONTH_SEC * 1000);

function update(){
  const now = Date.now();
  const amount = Math.max(0, now - START.getTime()) * RATE_PER_MS;

  document.getElementById('money').textContent =
    amount.toLocaleString('en-US', {
      minimumFractionDigits: 6,
      maximumFractionDigits: 6
    }) + ' $';

  const bananas = Math.floor(amount / 0.21);
  document.getElementById('bananaCount').textContent =
    'Bananas: ' + bananas.toLocaleString('en-US');
}

setInterval(update, 80);
update();
</script>
</body>
</html>
